name: CI

# Every branch push (PR checks attach to the head commit, so pull_request is not needed).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  database:
    name: Database (migrations, seed, pgTAP, lint, types)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase Postgres
        run: pnpm supabase db start

      - name: supabase db reset (clean rebuild from migrations + seed)
        run: pnpm supabase db reset --local

      - name: pgTAP (constraints, derived queries, RLS per role)
        run: pnpm supabase test db

      - name: Generated types match the schema
        run: |
          pnpm -s db:types
          git diff --exit-code -- types/database.ts \
            || (echo "::error::types/database.ts is stale. Run 'pnpm db:types' and commit." && exit 1)

      - name: Lint database functions (plpgsql_check)
        run: pnpm supabase db lint --local --level warning --fail-on error

      - name: Supabase logs on failure
        if: failure()
        run: docker logs supabase_db_vanshview 2>&1 | grep -E "ERROR|FATAL" | tail -50 || true

  e2e:
    name: End-to-end (local Supabase + app, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: 1
      # Phone sign-in needs an SMS provider switched on; test numbers never reach it.
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (database, auth, API)
        run: pnpm supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,storage-api,postgres-meta,mailpit

      - name: Point the app and tests at it
        run: |
          KEY=$(pnpm -s supabase status -o json | jq -r '.PUBLISHABLE_KEY')
          {
            echo "NEXT_PUBLIC_VANSHVIEW_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_VANSHVIEW_SUPABASE_KEY=$KEY"
            echo "E2E_SUPABASE_KEY=$KEY"
          } >> "$GITHUB_ENV"

      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
